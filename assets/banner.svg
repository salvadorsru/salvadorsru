<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="#080808"/>

  <!-- BallSpace: balls floating in the dark, brand palette -->
  <g opacity="0.9">
    <circle cx="70"   cy="60"  r="26" fill="#3b82f6"/>
    <circle cx="180"  cy="200" r="14" fill="#b91c1c"/>
    <circle cx="150"  cy="90"  r="8"  fill="#ec4899"/>
    <circle cx="1030" cy="70"  r="20" fill="#c6a210"/>
    <circle cx="1100" cy="180" r="30" fill="#7c3aed"/>
    <circle cx="1120" cy="50"  r="10" fill="#22c55e"/>
    <circle cx="1060" cy="230" r="12" fill="#ec4899"/>
    <circle cx="330"  cy="40"  r="10" fill="#c6a210"/>
    <circle cx="250"  cy="240" r="18" fill="#22c55e"/>
    <circle cx="420"  cy="230" r="9"  fill="#3b82f6"/>
    <circle cx="940"  cy="240" r="8"  fill="#b91c1c"/>
    <circle cx="860"  cy="50"  r="14" fill="#ec4899"/>
  </g>

  <ellipse cx="600" cy="140" rx="330" ry="120" fill="url(#glow)"/>

  <text x="600" y="128" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="64" fill="#ffffff">Salvador Sánchez Ruiz</text>
  <text x="600" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="10" fill="#3b82f6">POET · PROGRAMMER · SINGER</text>
</svg>

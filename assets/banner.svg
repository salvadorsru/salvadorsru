  <g clip-path="url(#card)">
    <circle cx="60" cy="30" r="150" fill="#ffffff" fill-opacity="0.10" filter="url(#glow)"/>
  </g>

  <rect x="540" y="52" width="32" height="3" rx="1.5" fill="#FF6DD6"/>
  <rect x="584" y="52" width="32" height="3" rx="1.5" fill="#E2AE2A"/>
  <rect x="628" y="52" width="32" height="3" rx="1.5" fill="#FF8601"/>

  <text x="600" y="118" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="46" fill="#ffffff">Salvador Sánchez Ruiz</text>
  <text x="600" y="156" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#8f8f96" letter-spacing="3">FULL-STACK DEVELOPER · PALMA DE MALLORCA</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" fill="none">
  <defs>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="198" rx="20"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="198" rx="20" fill="#080808"/>

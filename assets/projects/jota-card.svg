<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="330" viewBox="0 0 1200 330" fill="none">
  <defs>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="328" rx="20"/></clipPath>
    <clipPath id="mark"><rect x="72" y="105" width="120" height="120" rx="26"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="328" rx="20" fill="#080808"/>
  <rect x="1" y="1" width="1198" height="328" rx="20" fill="none" stroke="#FF6DD6" stroke-opacity="0.25"/>

  <g clip-path="url(#card)">
    <circle cx="40" cy="20" r="150" fill="#FF6DD6" fill-opacity="0.20" filter="url(#glow)"/>
  </g>

  <g clip-path="url(#mark)">
    <image x="72" y="105" width="120" height="120" xlink:href="data:image/jpeg;base64,"/>
  </g>

  <text x="232" y="118" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="3.5" fill="#FF6DD6">FEATURED PROJECT</text>
  <text x="232" y="172" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="42" fill="#ffffff">Jota</text>

  <text x="232" y="206" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#d6d3d1">My self-hosted music app: browse Spotify, play from YouTube.</text>
  <text x="232" y="234" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#d6d3d1">No cloud, no tracking, no subscriptions.</text>

  <rect x="936" y="137" width="200" height="56" rx="28" fill="#FF6DD6"/>
  <text x="1020" y="172" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="17" fill="#131111">View project</text>
  <g transform="translate(1088 155)" stroke="#131111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0 10h16"/>
    <path d="m11 5 5 5-5 5"/>
  </g>
</svg>
